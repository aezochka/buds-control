name: Build APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release:
        description: 'Опубликовать релиз (создаст тег vX.Y)'
        type: boolean
        default: false
      version:
        description: 'Версия релиза, например 8.0 (нужна при release=true)'
        type: string
        default: ''

# Права выдаются точечно: только job release получает contents: write
# (запись тега и релиза). Релизы создаются по тегу v* или вручную,
# а не на каждый пуш в main.

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew :app:testReleaseUnitTest --no-daemon --stacktrace

      # Ключ подписи хранится в Secrets, в git его нет и не будет.
      - name: Decode signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: printf '%s' "$KEYSTORE_BASE64" | base64 -d > signing.jks

      - name: Build APKs
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/signing.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          MANUAL_RELEASE: ${{ inputs.release }}
          MANUAL_VERSION: ${{ inputs.version }}
        run: |
          set -e
          # versionCode монотонный: 1000 + номер запуска workflow.
          ARGS=(-PversionCode=$((1000 + ${{ github.run_number }})))
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            ARGS+=(-PversionName="${GITHUB_REF_NAME#v}")
          elif [[ "$MANUAL_RELEASE" == "true" && -n "$MANUAL_VERSION" ]]; then
            ARGS+=(-PversionName="$MANUAL_VERSION")
          fi
          ./gradlew :app:assembleDebug :app:assembleRelease --no-daemon --stacktrace "${ARGS[@]}"

      - name: Rename APKs
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/BudsControl-debug.apk
          cp app/build/outputs/apk/release/app-release.apk out/BudsControl-release.apk
          ls -la out/

      # Артефакты — запасной канал: их хранилище имеет квоту и при её
      # исчерпании падал зелёный билд. Основной канал — Release, который
      # читает встроенный апдейтер приложения.
      - name: Upload APKs (artifact, best effort)
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: BudsControl-apk
          path: out/*.apk
          if-no-files-found: error

  release:
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && inputs.release == true)
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: BudsControl-apk
          path: out

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MANUAL_VERSION: ${{ inputs.version }}
        run: |
          set -e
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG="$GITHUB_REF_NAME"
          else
            TAG="v$MANUAL_VERSION"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            # При повторном запуске тег уже есть — пересоздаём поверх.
            git push origin ":refs/tags/$TAG" 2>/dev/null || true
            git tag "$TAG"
            git push origin "refs/tags/$TAG"
          fi
          VERSION="${TAG#v}"
          echo "release tag: $TAG (version $VERSION)"
          cat > notes.md <<'NOTES'
          Начиная с этой версии APK подписан новым ключом (старый был
          скомпрометирован публикацией в репозитории). Android не даст
          обновиться поверх прежней установки: удалите старую версию и
          поставьте APK из этого релиза. Все настройки и профили задаются
          заново.

          Что ещё изменилось:

          - из истории репозитория удалены ключ подписи и собранные APK;
          - фикс потери кадра протокола на границе чтения Bluetooth-сокета
            («кнопка иногда не реагирует»);
          - unit-тесты кодека протокола запускаются в CI перед сборкой;
          - лицензия проекта — GPL-3.0.
          NOTES
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" out/*.apk --clobber
          else
            gh release create "$TAG" out/*.apk \
              --title "EBuds $VERSION" \
              --notes-file notes.md
          fi
