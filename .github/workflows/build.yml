name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Build release APK
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Rename APKs
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/BudsControl-debug.apk
          cp app/build/outputs/apk/release/app-release.apk out/BudsControl-release.apk
          ls -la out/

      # Артефакты — не единственный канал: их хранилище имеет квоту и при её
      # исчерпании падал ЗЕЛЁНЫЙ билд. Основной канал доставки теперь Release,
      # который к тому же читает встроенный апдейтер приложения.
      - name: Upload APKs (artifact, best effort)
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: BudsControl-apk
          path: out/*.apk
          if-no-files-found: error

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          VERSION=$(grep -m1 'versionName' app/build.gradle.kts | sed 's/.*"\(.*\)".*/\1/')
          TAG="v$VERSION"
          echo "release tag: $TAG"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" out/*.apk --clobber
          else
            gh release create "$TAG" out/*.apk \
              --title "EBuds $VERSION" \
              --notes "Автосборка из main ($GITHUB_SHA)."
          fi
