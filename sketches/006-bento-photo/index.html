<!doctype html><html lang="ru"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0..1,0&family=Roboto+Flex:opsz,wght,wdth@8..144,100..1000,25..151&display=swap" rel="stylesheet">
<title>Bento + photo</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --primary:#B8E86B; --on-primary:#233600; --primary-container:#3A5200; --on-primary-container:#D3FF87;
  --accent2:#FFB0C8;
  --surface:#0C0C0B; --on-surface:#E9E9E4;
  --sc-low:#151614; --sc:#1A1A18; --sc-high:#232420; --sc-highest:#2E2F2A;
  --on-surface-variant:#C6C7BE; --outline:#909187; --outline-variant:#45463F;
  --spring:520ms cubic-bezier(.22,1.4,.32,1);
  --springq:300ms cubic-bezier(.2,1.6,.36,1);
  --fx:190ms cubic-bezier(.2,0,0,1);
  --r:26px;
}
html,body{background:var(--surface)}
body{font-family:'Roboto Flex',system-ui,sans-serif;color:var(--on-surface);
  -webkit-font-smoothing:antialiased;overflow-x:hidden;padding:0 0 118px}
.material-symbols-rounded{font-family:'Material Symbols Rounded';font-weight:400;line-height:1;
  display:inline-block;-webkit-font-feature-settings:'liga';user-select:none}
.f1{font-variation-settings:'FILL' 1}
svg.defs{position:absolute;width:0;height:0}
.disp{font-size:40px;line-height:44px;letter-spacing:-.6px;font-variation-settings:'wght' 720,'wdth' 103;
  font-variant-numeric:tabular-nums}
.tl{font-size:19px;line-height:25px;font-variation-settings:'wght' 650}
.tm{font-size:14.5px;line-height:20px;font-variation-settings:'wght' 620}
.bm{font-size:13px;line-height:18px;letter-spacing:.2px}
.bs{font-size:11px;line-height:15px;letter-spacing:.4px}
.lbl{font-size:10px;letter-spacing:1.2px;font-variation-settings:'wght' 700;text-transform:uppercase}

.state{position:relative;overflow:hidden;isolation:isolate}
.state::after{content:"";position:absolute;inset:0;background:currentColor;opacity:0;
  transition:opacity var(--fx);pointer-events:none;z-index:1}
.state:hover::after{opacity:.06}.state:active::after{opacity:.10}
.ripple{position:absolute;border-radius:999px;background:currentColor;opacity:.2;transform:scale(0);
  pointer-events:none;z-index:2;animation:rip 620ms cubic-bezier(.2,0,0,1) forwards}
@keyframes rip{to{transform:scale(2.8);opacity:0}}

/* ===== HERO: настоящая фотография наушников ===== */
.hero{position:relative;padding:14px 18px 0}
.hero::before{content:"";position:absolute;top:6px;left:50%;transform:translateX(-50%);
  width:340px;height:340px;border-radius:50%;pointer-events:none;
  background:radial-gradient(circle,rgba(184,232,107,.13),transparent 64%)}
.bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:2px}
.bar .nm{display:flex;align-items:center;gap:8px;color:var(--on-surface-variant)}
.bar .nm .d{width:7px;height:7px;border-radius:99px;background:var(--primary);
  animation:pl 2.6s ease-in-out infinite}
@keyframes pl{0%,100%{box-shadow:0 0 0 0 rgba(184,232,107,.45)}50%{box-shadow:0 0 0 6px rgba(184,232,107,0)}}
.ib{width:40px;height:40px;border:0;border-radius:99px;background:transparent;color:var(--on-surface-variant);
  display:grid;place-items:center;cursor:pointer;transition:background var(--fx),border-radius var(--springq)}
.ib:hover{background:var(--sc-high);border-radius:13px}
.ib .material-symbols-rounded{font-size:20px}

.photo{position:relative;display:flex;justify-content:center;padding:2px 0 0}
.photo img{width:78%;max-width:300px;height:auto;display:block;
  filter:drop-shadow(0 26px 30px rgba(0,0,0,.62));
  animation:hover 6s ease-in-out infinite}
@keyframes hover{0%,100%{transform:translateY(0) rotate(-.6deg)}50%{transform:translateY(-10px) rotate(.6deg)}}

/* заряд поверх фото — два компактных чипа */
.chips{position:absolute;inset:0;pointer-events:none}
.chip{position:absolute;display:flex;align-items:center;gap:6px;padding:7px 12px;border-radius:999px;
  background:rgba(35,36,32,.9);backdrop-filter:blur(8px);white-space:nowrap}
.chip b{font-variation-settings:'wght' 700;font-size:13px;font-variant-numeric:tabular-nums}
.chip .s{font-size:9.5px;letter-spacing:.9px;color:var(--on-surface-variant)}
.chip.l{left:2px;top:34%} .chip.r{right:2px;top:20%}
.chip.c{left:50%;transform:translateX(-50%);bottom:-2px;background:var(--primary-container);color:var(--on-primary-container)}
.chip .material-symbols-rounded{font-size:13px}

/* ===== BENTO: разные размеры плиток, вместе, но интереснее ===== */
.bento{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:22px 18px 0;align-items:stretch}
.t{background:var(--sc);border:0;border-radius:var(--r);padding:15px;color:var(--on-surface);
  font:inherit;text-align:left;cursor:pointer;display:flex;flex-direction:column;
  transition:background var(--fx),border-radius var(--springq),transform var(--springq)}
.t:active{transform:scale(.975)}
.t .material-symbols-rounded{font-size:23px;color:var(--on-surface-variant)}
.t .k{color:var(--on-surface-variant)}
.t .k.push{margin-top:auto}
.t .v{font-variation-settings:'wght' 700;font-size:26px;line-height:30px;font-variant-numeric:tabular-nums}
.t .v small{font-size:13px;color:var(--on-surface-variant);font-variation-settings:'wght' 400}

.w4{grid-column:span 4} .w3{grid-column:span 3} .w2{grid-column:span 2} .w1{grid-column:span 1}
.h2{min-height:134px} .h1{min-height:110px}

/* ON-состояние: акцент + морф формы иконки */
.t.on{background:var(--primary);color:var(--on-primary)}
.t.on .material-symbols-rounded{color:var(--on-primary);font-variation-settings:'FILL' 1}
.t.on .k{color:var(--on-primary)}
.t .ico{width:40px;height:40px;display:grid;place-items:center;background:var(--sc-highest);
  clip-path:url(#cpSquare);transition:clip-path 1ms,background var(--fx);margin-bottom:10px}
.t.on .ico{background:rgba(0,0,0,.14);clip-path:url(#cpClover4Leaf)}

/* иконочные квадраты без подписи */
.t.sq{align-items:center;justify-content:center;padding:0}
.t.sq .material-symbols-rounded{font-size:25px}
.t.sq.on{background:var(--primary)}

/* EQ-плитка: живые столбики */
.eq{display:flex;align-items:flex-end;gap:4px;height:34px;margin-bottom:10px}
.eq i{flex:1;border-radius:99px;background:var(--outline);transition:height var(--spring),background var(--fx)}
.t.on .eq i{background:var(--on-primary);animation:eqa 1.05s ease-in-out infinite alternate}
.t.on .eq i:nth-child(2){animation-delay:.13s}
.t.on .eq i:nth-child(3){animation-delay:.26s}
.t.on .eq i:nth-child(4){animation-delay:.39s}
.t.on .eq i:nth-child(5){animation-delay:.52s}
@keyframes eqa{from{transform:scaleY(.55)}to{transform:scaleY(1)}}

/* прогресс внутри плитки кейса */
.tr{height:5px;border-radius:99px;background:var(--sc-highest);margin-top:9px;overflow:hidden}
.tr i{display:block;height:100%;border-radius:99px;background:var(--primary);transition:width var(--spring)}

/* жесты — список внизу, компактно */
.sec{padding:22px 18px 0}
.g{display:flex;align-items:center;gap:12px;padding:13px 15px;border-radius:19px;background:var(--sc-low);
  margin-bottom:6px;cursor:pointer;transition:background var(--fx)}
.g:hover{background:var(--sc)}
.g .n{flex:1}
.g .v{color:var(--on-surface-variant)}
.g .material-symbols-rounded{font-size:18px;color:var(--outline)}

/* toolbar */
.tb{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom));
  display:flex;align-items:center;gap:3px;padding:7px;background:rgba(26,26,24,.95);
  backdrop-filter:blur(20px);border-radius:999px;box-shadow:0 10px 26px -8px rgba(0,0,0,.75)}
.tbi{width:52px;height:52px;border:0;border-radius:99px;background:none;color:var(--on-surface-variant);
  cursor:pointer;display:grid;place-items:center;transition:background var(--fx),border-radius var(--springq),color var(--fx)}
.tbi .material-symbols-rounded{font-size:22px}
.tbi:hover{background:var(--sc-highest);border-radius:17px}
.tbi.sel{background:var(--primary);color:var(--on-primary);border-radius:16px}
.tbi.sel .material-symbols-rounded{font-variation-settings:'FILL' 1}
.fab{width:56px;height:56px;border:0;background:var(--accent2);color:#5C1133;cursor:pointer;
  display:grid;place-items:center;margin-left:3px;clip-path:url(#cpCookie9Sided);
  transition:transform var(--spring),clip-path 1ms}
.fab:active{transform:scale(.88) rotate(-10deg)}
.fab .material-symbols-rounded{font-size:24px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>

<div class="bento">
  <!-- широкая: режим звука с живым EQ -->
  <button class="t w2 h2 on state" id="eqt">
    <span class="eq"><i style="height:34%"></i><i style="height:70%"></i><i style="height:100%"></i><i style="height:52%"></i><i style="height:38%"></i></span>
    <span class="k lbl push">Эквалайзер</span>
    <span class="tm">Бас</span>
  </button>
  <!-- игровой режим -->
  <button class="t w2 h2 on state" id="gm">
    <span class="ico"><span class="material-symbols-rounded">sports_esports</span></span>
    <span class="k lbl push">Режим</span>
    <span class="tm">Игровой</span>
  </button>

  <!-- кейс: широкая с прогрессом -->
  <div class="t w3 h1" style="justify-content:space-between">
    <span class="material-symbols-rounded">inventory_2</span>
    <span class="k lbl" style="margin-top:8px">Кейс</span>
    <span class="v">50<small>%</small></span>
    <span class="tr"><i style="width:50%"></i></span>
  </div>
  <!-- квадрат-иконка: найти -->
  <button class="t w1 h1 sq state" title="Найти наушники">
    <span class="material-symbols-rounded">notifications_active</span>
  </button>

  <!-- маленькие метрики -->
  <div class="t w2 h1">
    <span class="material-symbols-rounded">bluetooth_connected</span>
    <span class="k lbl" style="margin-top:8px">Задержка</span>
    <span class="v">88<small> мс</small></span>
  </div>
  <div class="t w2 h1">
    <span class="material-symbols-rounded">battery_charging_full</span>
    <span class="k lbl" style="margin-top:8px">Осталось</span>
    <span class="v">21<small> ч</small></span>
  </div>

  <!-- три квадратных тумблера в один ряд -->
  <button class="t w1 h1 sq state" id="s1" title="Найти телефон"><span class="material-symbols-rounded">phonelink_ring</span></button>
  <button class="t w1 h1 sq state" id="s2" title="Пространственный звук"><span class="material-symbols-rounded">spatial_audio</span></button>
  <button class="t w1 h1 sq state" id="s3" title="Два устройства"><span class="material-symbols-rounded">devices</span></button>
  <button class="t w1 h1 sq state" id="s4" title="Прошивка"><span class="material-symbols-rounded">memory</span></button>
</div>

<div class="sec">
  <div class="tl" style="margin-bottom:11px">Жесты</div>
  <div class="g state"><span class="n bm">Двойное касание</span><span class="v bm">Плей / пауза</span><span class="material-symbols-rounded">chevron_right</span></div>
  <div class="g state"><span class="n bm">Тройное касание</span><span class="v bm">Следующий трек</span><span class="material-symbols-rounded">chevron_right</span></div>
  <div class="g state"><span class="n bm">Долгое нажатие</span><span class="v bm">Помощник</span><span class="material-symbols-rounded">chevron_right</span></div>
</div>

<div class="tb">
  <button class="tbi sel"><span class="material-symbols-rounded">headphones</span></button>
  <button class="tbi state"><span class="material-symbols-rounded">graphic_eq</span></button>
  <button class="tbi state"><span class="material-symbols-rounded">touch_app</span></button>
  <button class="tbi state"><span class="material-symbols-rounded">more_horiz</span></button>
  <button class="fab state"><span class="material-symbols-rounded f1">search</span></button>
</div>

<script>
['eqt','gm','s1','s2','s3','s4'].forEach(function(id){
  var el=document.getElementById(id); if(!el) return;
  el.addEventListener('click',function(){el.classList.toggle('on')});
});
document.querySelectorAll('.t.sq').forEach(function(el){
  el.addEventListener('click',function(){el.classList.toggle('on')});
});
var SHP=["cpCookie9Sided","cpSunny","cpClover4Leaf","cpFlower","cpPuffyDiamond"],fi=0;
document.querySelector('.fab').addEventListener('click',function(){
  fi=(fi+1)%SHP.length;this.style.clipPath='url(#'+SHP[fi]+')';
});
document.querySelectorAll('.state').forEach(function(el){
  el.addEventListener('pointerdown',function(e){
    if(window.matchMedia('(prefers-reduced-motion: reduce)').matches)return;
    var r=el.getBoundingClientRect(),s=Math.max(r.width,r.height),d=document.createElement('span');
    d.className='ripple';d.style.width=d.style.height=s+'px';
    d.style.left=(e.clientX-r.left-s/2)+'px';d.style.top=(e.clientY-r.top-s/2)+'px';
    el.appendChild(d);setTimeout(function(){d.remove()},660);
  });
});
</script></body></html>
